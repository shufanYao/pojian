<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>破茧 · 文章</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">
  <!-- 左栏：文章内容（由 js/article.js 渲染） -->
  <div class="content" id="content"></div>

  <!-- 右栏：阅读笔记面板（点击“阅读笔记”按钮后展开） -->
  <aside class="notes-panel" id="notesPanel" aria-label="阅读笔记面板">
    <div class="notes-head">
      <div class="nh-eyebrow">Reading Notes</div>
      <h3 id="notesTitle">我的阅读笔记</h3>
      <p class="sub">左侧阅读 · 右侧随想——写下感想、批注与关联阅读</p>
    </div>

    <div class="toolbar" role="toolbar" aria-label="格式工具栏">
      <button class="tb-btn" data-cmd="bold" title="加粗 (Ctrl+B)"><strong>B</strong></button>
      <button class="tb-btn" data-cmd="italic" title="斜体 (Ctrl+I)"><em>I</em></button>
      <button class="tb-btn" data-cmd="underline" title="下划线 (Ctrl+U)"><span style="text-decoration:underline">U</span></button>
      <span class="tb-sep"></span>
      <button class="tb-btn" data-cmd="h3" title="小标题">H</button>
      <button class="tb-btn" data-cmd="quote" title="引用块">&gt;</button>
      <span class="tb-sep"></span>
      <button class="tb-btn" data-cmd="ul" title="无序列表">•</button>
      <button class="tb-btn" data-cmd="ol" title="有序列表">1.</button>
      <span class="tb-sep"></span>
      <button class="tb-btn" data-cmd="link" title="插入链接">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7.07 0l3.18-3.18a5 5 0 0 0-7.07-7.07L11.5 5.4"/><path d="M14 10a5 5 0 0 0-7.07 0l-3.18 3.18a5 5 0 0 0 7.07 7.07l1.67-1.66"/></svg>
      </button>
      <button class="tb-btn" data-cmd="clear" title="清除格式">⌫</button>
    </div>

    <div class="editor" id="editor" contenteditable="true" data-placeholder="写下你的感想、批注与联想……" spellcheck="false"></div>

    <div class="notes-foot">
      <div>
        <span class="count" id="count">0 字</span>
        <span class="save-state" id="saveState"></span>
      </div>
      <div class="actions">
        <button class="pill-btn" id="btnExport" title="导出为 Markdown 文件">导出</button>
        <button class="pill-btn danger" id="btnClear" title="清空本篇笔记">清空</button>
        <button class="pill-btn primary" id="btnSave" title="立即保存到本地">保存</button>
      </div>
    </div>
  </aside>
</div>

<footer class="site-foot">
  <p>破茧 · 学习网站 ｜ 每周一、三、五 20:00 更新一篇，三个栏目轮番登场</p>
  <p class="foot-note">站内所收作品均已进入公有领域；外文作品译文为本站原创翻译。</p>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/article.js"></script>
</body>
</html>
